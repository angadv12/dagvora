[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagvora"
version = "0.1.0"
description = "Agent runtime with a safely mutable task DAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
